name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - .gitignore
      - "*.md"
      - ".github/screenshots/**"
  push:
    paths-ignore:
      - .gitignore
      - "*.md"
      - ".github/screenshots/**"

jobs:
  build-docker-amd64:
    permissions: write-all
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        id: docker_login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta_amd64
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.actor }}/tanoshi-builder
          tags: |
            type=raw,value=latest,enable={{ is_default_branch }}
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{ version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=sha

      - name: Build Push
        if: "${{ steps.docker_meta_amd64.outputs.tags != '' }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta_amd64.outputs.tags }}
          labels: ${{ steps.docker_meta_amd64.outputs.labels }}
          build-args: |
            BUILD_WEB=false
          cache-from: type=registry,ref=ghcr.io/${{ github.actor }}/tanoshi-builder:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.actor }}/tanoshi-builder:buildcache,mode=max

  build-docker-aarch64:
    permissions: write-all
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta_aarch64
        env: 
          ARCH: aarch64
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.actor }}/tanoshi-builder
          tags: |
            type=raw,value=dev,suffix=-${{ env.ARCH }},enable=${{ github.ref_name == 'dev' }}
            type=raw,value=latest,suffix=-${{ env.ARCH }},enable={{ is_default_branch }}
            type=ref,event=branch,suffix=-${{ env.ARCH }}
            type=ref,event=pr,suffix=-${{ env.ARCH }}
            type=semver,pattern={{ version }},suffix=-${{ env.ARCH }}
            type=semver,pattern={{ major }}.{{ minor }},suffix=-${{ env.ARCH }}
            type=sha,suffix=-${{ env.ARCH }}

      - name: Build Push
        id: build_push
        env:
          ARCH: aarch64
        if: "${{ steps.docker_meta_aarch64.outputs.tags != '' }}"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/aarch64
          push: true
          tags: ${{ steps.docker_meta_aarch64.outputs.tags }}
          labels: ${{ steps.docker_meta_aarch64.outputs.labels }}
          build-args: |
            BUILD_WEB=false
          cache-from: type=registry,ref=ghcr.io/${{ github.actor }}/tanoshi-builder:buildcache-${{ env.ARCH }}
          cache-to: type=registry,ref=ghcr.io/${{ github.actor }}/tanoshi-builder:buildcache-${{ env.ARCH }},mode=max
  
  docker-build-merge:
    permissions: write-all
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    needs:
      - build-docker-amd64
      - build-docker-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.actor }}/tanoshi-builder
          tags: |
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            type=raw,value=latest,enable={{ is_default_branch }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{ version }}
            type=semver,pattern={{ major }}.{{ minor }}
            type=sha
  
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y jq

      - name: Login to DockerHub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        if: "${{ env.DOCKER_USERNAME != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Use the merged tags to create a single manifest tag
      - name: Create Combined Manifest Tag
        id: create_combined_manifest
        env:
          DOCKER_CLI_ACI: "1"
        run: |
          for TAG in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            echo "Creating manifest tag $TAG"
            # Replace ghcr.io/${{ github.actor }} with docker.io/${{ secrets.DOCKER_USERNAME }} if DOCKER_USERNAME is set
            if [ "${{ secrets.DOCKER_USERNAME }}" != "" ]; then
              DOCKERHUB_TAG=$(echo "--tag $TAG" | sed "s/ghcr.io\/${{ github.actor }}/${{ secrets.DOCKER_USERNAME }}/")
            else
              DOCKERHUB_TAG=""
            fi
            
            docker buildx imagetools create --append "${TAG}-aarch64" --tag "${TAG}" ${DOCKERHUB_TAG}
          done
